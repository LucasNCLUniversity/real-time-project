<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real Time</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: #080a0f;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Rajdhani', sans-serif;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: -100px; left: 50%; transform: translateX(-50%);
            width: 600px; height: 600px;
            background: radial-gradient(circle, rgba(0,200,180,0.06) 0%, transparent 70%);
            pointer-events: none;
        }

        .grid {
            position: fixed; inset: 0;
            background-image:
                linear-gradient(rgba(0,200,180,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,200,180,0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
        }

        .label {
            font-weight: 300;
            font-size: 11px;
            letter-spacing: 0.4em;
            color: #00c8b4;
            text-transform: uppercase;
            margin-bottom: 24px;
            opacity: 0.7;
            animation: fadein 1s ease forwards;
        }

        .clock {
            font-family: 'Share Tech Mono', monospace;
            font-size: clamp(64px, 15vw, 120px);
            color: #e8efe8;
            letter-spacing: 0.06em;
            line-height: 1;
            text-shadow: 0 0 60px rgba(0,200,180,0.15);
            animation: fadein 1s ease 0.2s both;
        }

        .colon {
            color: #00c8b4;
            animation: blink 1s step-end infinite;
        }

        .date {
            font-weight: 400;
            font-size: 18px;
            letter-spacing: 0.25em;
            color: #4a5568;
            margin-top: 20px;
            animation: fadein 1s ease 0.4s both;
        }

        .line {
            width: 60px; height: 1px;
            background: linear-gradient(90deg, transparent, #00c8b4, transparent);
            margin: 28px auto;
            animation: fadein 1s ease 0.6s both;
        }

        .sub {
            font-weight: 300;
            font-size: 12px;
            letter-spacing: 0.35em;
            color: #2a3a3a;
            text-transform: uppercase;
            animation: fadein 1s ease 0.8s both;
        }

        @keyframes fadein {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50%       { opacity: 0.15; }
        }
    </style>
</head>
<body>
    <div class="grid"></div>
    <div class="label">Current Local Time</div>
    <div class="clock">
        <span id="hours">00</span><span class="colon">:</span><span id="minutes">00</span><span class="colon">:</span><span id="seconds">00</span>
    </div>
    <div class="date" id="date">— — —</div>
    <div class="line"></div>
    <div class="sub">Real Time Project</div>

    <script>
        function updateClock() {
            const now = new Date();
            const pad = n => String(n).padStart(2, '0');
            const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
            const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

            document.getElementById('hours').textContent   = pad(now.getHours());
            document.getElementById('minutes').textContent = pad(now.getMinutes());
            document.getElementById('seconds').textContent = pad(now.getSeconds());
            document.getElementById('date').textContent    =
                `${days[now.getDay()]}  ${pad(now.getDate())} ${months[now.getMonth()]} ${now.getFullYear()}`;
        }

        updateClock();
        setInterval(updateClock, 1000);
    </script>
</body>
</html>
